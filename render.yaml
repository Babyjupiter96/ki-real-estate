databases:
  - name: ki-db
    plan: free
    databaseName: ki
    user: ki

services:
  - type: web
    name: ki-real-estate
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ki-db
          property: connectionString
      # This service's own public URL (fill in after first deploy, e.g.
      # https://ki-real-estate.onrender.com), then redeploy.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # The Ki SEO site's public URL, once it's deployed.
      - key: NEXT_PUBLIC_SEO_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
